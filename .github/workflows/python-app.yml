name: 构建并打包 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮运行

jobs:
  build:
    runs-on: windows-latest # ⚠️ 重要：打包Windows EXE必须用 windows 环境

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt5
        # 如果你有 requirements.txt，最好用下面这行代替上面两行：
        # pip install -r requirements.txt

    - name: 使用 PyInstaller 打包
      run: |
        # --noconfirm 覆盖旧文件 --windowed 隐藏黑框 --name 指定exe名字
         pyinstaller --noconfirm --windowed --name BaoxinSimulator --collect-all PyQt5 main.py

    - name: 上传打包后的文件 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: BaoxinSimulator
        path: dist/BaoxinSimulator/
